name: Update theme

# Controls when the workflow will run
on:
  schedule:
    # Update theme automatically everyday at 00:00 UTC
    - cron: "0 0 * * *"
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  update-theme:
    runs-on: ubuntu-latest

    permissions:
      # Give the default GITHUB_TOKEN write permission to commit and push the
      # added or changed files to the repository.
      contents: write
    
    steps:
      - uses: https://git.yolo.fail/actions/checkout@v4

      - name: Setup Hugo
        uses: https://git.yolo.fail/actions/peaceiris-actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      # Hugo modules are Go modules; the runner image has no Go
      - name: Setup Go
        uses: https://git.yolo.fail/actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Update theme
        run: hugo mod get -u

      - name: Tidy go.mod, go.sum
        run: hugo mod tidy

      - name: Commit changes
        uses: https://git.yolo.fail/actions/stefanzweifel-git-auto-commit-action@v5
        with:
          commit_message: "CI: Update theme"
