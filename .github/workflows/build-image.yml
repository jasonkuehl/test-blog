name: Build site image

# Builds the site into an nginx image and pushes it to Gitea's container registry.
# Tags: latest (default branch), sha-<commit>, build-<run number>, and X.Y.Z / X.Y for v* git tags.
# Pull requests build the image without pushing it.

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: git.yolo.fail

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Registry paths must be lowercase; the repo name may not be
      - name: Set image name
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Gitea Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          # Gitea 1.27's registry rejects the job token (it gets no package scope), so log in with a
          # package-only personal access token stored as the user-level Actions secret REGISTRY_TOKEN
          username: ${{ github.repository_owner }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=raw,value=build-${{ github.run_number }},enable=${{ github.event_name != 'pull_request' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr

      # SITE_BASE_URL is an optional repo variable; empty means the site's own config is used
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            BASE_URL=${{ vars.SITE_BASE_URL }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}:buildcache,mode=max', env.IMAGE) || '' }}

      # Gitea doesn't link container images to their repository by itself, so link this one and it
      # shows under the repo's Packages tab. 201 = linked now, 400 = already linked (both fine).
      - name: Link image to this repository
        if: github.event_name != 'pull_request'
        env:
          TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          name="$(echo "${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]')"
          repo="${GITHUB_REPOSITORY#*/}"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: token $TOKEN" \
            "${{ github.api_url }}/packages/${{ github.repository_owner }}/container/$name/-/link/$repo")
          case "$code" in
            201) echo "Linked $name to $repo" ;;
            400) echo "$name is already linked" ;;
            *)   echo "::error::Linking $name to $repo failed (HTTP $code)"; exit 1 ;;
          esac
